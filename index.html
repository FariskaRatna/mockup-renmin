<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIERA DELTA LIMA (prototipe)</title>
<script>
/* Tema dipasang sebelum render agar tidak berkedip. localStorage hanya untuk preferensi tema. */
(function(){var p='system';try{p=localStorage.getItem('sdl-theme')||'system'}catch(e){}
var d=p==='dark'||(p==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light')})();
</script>
<style>
/* =====================================================================
   1. TOKEN — disalin dari apps/frontend/src/style.css baris 2–3 apa adanya,
      lalu diubah HANYA sesuai usulan yang disetujui:
      --muted terang #8191a4 -> #5f6f84 · --gold-ink terang #98703b -> #8a6431
      baru: --focus, --focus-inverse, --border-input, --header-h, --fs-*, --lh-*
   ===================================================================== */
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-synthesis:none;color-scheme:light;--bg:#f5f7fb;--card:#fff;--ink:#14243e;--ink-2:#344b68;--muted:#5f6f84;--border:#e5eaf1;--navy:#111f35;--navy-2:#1d3150;--gold:#d5ad67;--shadow:0 12px 36px rgba(30,49,77,.05);--subtle:#f4f7fb;--gold-ink:#8a6431;
  --focus:#2f5f9e;--focus-inverse:#8fb6e8;--border-input:#76869a;--header-h:75px;
  --fs-12:12px;--fs-13:13px;--fs-14:14px;--fs-16:16px;--fs-20:20px;--fs-24:24px;--lh-body:1.5;--lh-tight:1.3}
:root[data-theme=dark]{color-scheme:dark;--bg:#0c1525;--card:#162438;--ink:#edf2f7;--ink-2:#c7d4e6;--muted:#95a8bd;--border:#2c3b52;--navy:#091321;--navy-2:#162c48;--shadow:0 12px 30px #02091630;--subtle:#1c2e45;--gold-ink:#dfb978;
  --focus:#8fb6e8;--border-input:#6b7f99}
@media (max-width:640px){:root{--header-h:67px}}

/* =====================================================================
   2. VARIABEL KOMPONEN PROTOTIPE — BUKAN token style.css.
      Usulan nilai (status, warna unit gelap, tombol primer) yang perlu
      keputusan sebelum dipindah ke style.css. Lihat laporan.
   ===================================================================== */
:root{--proto-h:48px;--primary:#243f6c;--st-neutral:#344b68;--st-info:#2c5a96;--st-warn:#8a5a12;--st-danger:#a8323e;--st-ok:#1c6e50;--danger-bg:#fdf1f2;
  --u-urmin:#1d7a64;--u-ren:#3b67a8;--u-sumda:#7a55a0;--u-binfung:#8f6224;--u-spip:#344b68;
  --us-urmin:#e7f5f0;--us-ren:#ebf1fb;--us-sumda:#f2edf8;--us-binfung:#f8f0e4;--us-spip:#eef2f7;
  --side-ink:#c9d6e3;--side-group:#95a8bd;
  /* warna unit di atas navy (sidebar), sama di kedua tema */
  --un-urmin:#c7d4e6;--un-ren:#c7d4e6;--un-sumda:#c7d4e6;--un-binfung:#c7d4e6}
:root[data-theme=dark]{--primary:#3a5f93;--st-neutral:#c7d4e6;--st-info:#9fc2f0;--st-warn:#f0c27a;--st-danger:#ff9ea6;--st-ok:#7fdcb5;--danger-bg:#3a2228;
  --u-urmin:#6fd1b5;--u-ren:#9fbff0;--u-sumda:#c9aeea;--u-binfung:#e6be82;--u-spip:#c7d4e6;
  --us-urmin:#183a34;--us-ren:#1d3150;--us-sumda:#2e2645;--us-binfung:#3a2f1e;--us-spip:#1c2e45}
/* Palet grafik (Dashboard pimpinan) — BUKAN token style.css. Divalidasi dengan validate_palette.js
   (skill dataviz): ALL CHECKS PASS di latar terang, gelap #0c1525, dan kartu gelap #162438;
   ΔE normal terkecil 30.7, CVD terkecil 25.7. Hanya untuk MARK (batang, segmen), tidak untuk teks.
   Status sama di kedua tema dan selalu disertai label teks; magnitudo = satu hue biru. */
:root{--ch-ok:#0ca30c;--ch-run:#3987e5;--ch-late:#d03b3b;--ch-seq:#256abf}
:root[data-theme=dark]{--ch-seq:#5598e7}
body.proto-off{--proto-h:0px}

/* 3. DASAR */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--header-h) + 8px);scroll-padding-bottom:calc(var(--proto-h) + 8px)}
body{margin:0;min-width:320px;background:var(--bg);color:var(--ink);font-size:var(--fs-14);line-height:var(--lh-body);padding-bottom:var(--proto-h)}
h1,h2,h3{line-height:var(--lh-tight);margin:0;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
img{max-width:100%}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.on-navy :focus-visible{outline-color:var(--focus-inverse)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{flex:none;display:block}
.skip{position:absolute;left:8px;top:-60px;z-index:200;background:var(--card);color:var(--ink);padding:10px 16px;border:2px solid var(--focus);border-radius:8px;font-weight:600;text-decoration:none}
.skip:focus{top:8px}
[tabindex="-1"]:focus{outline:none}
.tlink{color:var(--ink-2);font-weight:600;font-size:var(--fs-13);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.sample{display:inline-block;font-size:var(--fs-12);font-weight:600;color:var(--muted);border:1px dashed var(--border-input);border-radius:4px;padding:0 6px;line-height:1.6;white-space:nowrap}
.muted{color:var(--muted)}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}

/* 4. KONTROL */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border:1px solid var(--border-input);border-radius:8px;background:var(--card);color:var(--ink);font-size:var(--fs-14);font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--subtle)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary);filter:brightness(1.12)}
.btn-danger{background:#a8323e;border-color:#a8323e;color:#fff}
.btn-danger:hover:not(:disabled){background:#a8323e;filter:brightness(1.1)}
.btn-sm{min-height:32px;padding:4px 12px;font-size:var(--fs-13)}
.btn-block{width:100%;min-height:44px}
.btn:disabled{opacity:.55}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--subtle)}
.why{font-size:var(--fs-13);color:var(--muted)}
.field{margin-top:16px}
.field label,.flabel{display:block;font-size:var(--fs-13);font-weight:600;color:var(--ink);margin-bottom:6px}
.input,select.input{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--border-input);border-radius:8px;background:var(--card);color:var(--ink);font-size:var(--fs-14)}
.input::placeholder{color:var(--muted);opacity:1}
.input[aria-invalid=true]{border-color:var(--st-danger);box-shadow:0 0 0 1px var(--st-danger)}
.err{display:flex;gap:6px;align-items:flex-start;margin-top:6px;font-size:var(--fs-13);color:var(--st-danger);font-weight:600}
.hint{margin-top:6px;font-size:var(--fs-13);color:var(--muted)}
@media (max-width:640px){.input,select.input{font-size:var(--fs-16)}}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--st-danger);border-left-width:4px;border-radius:8px;background:var(--danger-bg);color:var(--ink);margin-top:16px}
.alert .ic{color:var(--st-danger);margin-top:2px}
.alert strong{display:block}
.alert p{font-size:var(--fs-13);margin-top:2px}

/* Badge status: teks + titik. Warna hanya untuk status. */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-13);font-weight:600;white-space:nowrap;color:var(--st-neutral)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.st-neutral{color:var(--st-neutral)}.st-info{color:var(--st-info)}.st-warn{color:var(--st-warn)}.st-danger{color:var(--st-danger)}.st-ok{color:var(--st-ok)}
.badge.st-neutral::before{background:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-12);font-weight:600;color:var(--ink-2);border:1px solid var(--border-input);border-radius:4px;padding:0 6px;line-height:1.6;white-space:nowrap}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-13);font-weight:600;white-space:nowrap}
.late{color:var(--st-danger);font-weight:600}

/* 5. HEADER — bentuk mengikuti header produksi (App.tsx .sdl-header + PortalRefresh.css
      .sdl-nav-clean): tombol nav berikon + label + jumlah, pill latar untuk item aktif,
      separator, tombol tema kotak membulat, menu akun avatar + nama + chevron.
      Ukuran nav = produksi (12px/700, tombol 38px, ikon 17px). Sengaja beda: penanda aktif kedua berupa garis
      --gold-ink (pill prod 1.07:1), label tidak pernah disembunyikan (prod ikon saja 770–900px). */
.hdr{position:sticky;top:0;z-index:50;height:var(--header-h);display:flex;align-items:center;gap:16px;padding:0 clamp(16px,2.6vw,38px);background:var(--card);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;flex:0 1 auto;min-width:0;min-height:44px;border-radius:6px}
.brand img{height:42px;width:42px;display:block;flex:none}
.brand-words{min-width:0}
.brand-words strong{display:block;font-size:var(--fs-14);font-weight:900;letter-spacing:.025em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Wordmark satu warna (keputusan pemilik): "DELTA LIMA" tidak dibedakan warnanya */
.brand-words em{font-style:normal;color:inherit}
.brand-words small{display:block;margin-top:2px;font-size:var(--fs-12);font-weight:600;letter-spacing:.01em;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hnav{margin-left:auto;min-width:0}
.hnav>ul{display:flex;align-items:center;margin:0;padding:0;list-style:none;gap:4px}
.hnav li{position:relative;display:flex}
.hnav a,.hnav .nav-btn{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border:0;border-radius:9px;background:none;font-size:var(--fs-12);font-weight:700;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.hnav a:hover,.hnav .nav-btn:hover,.hnav .nav-btn[aria-expanded=true]{background:var(--subtle);color:var(--ink)}
/* Item aktif: pill latar seperti produksi + bingkai --border-input (3.72:1) — tanpa warna emas */
.hnav [aria-current=page],.hnav .nav-btn.is-current{background:var(--subtle);color:var(--ink);box-shadow:inset 0 0 0 1px var(--border-input)}
.nav-count{font-variant-numeric:tabular-nums}
.hnav .nav-count{margin-left:-4px}
.hactions{display:flex;align-items:center;gap:8px}
.hsep{width:1px;height:24px;background:var(--border);margin:0 4px;flex:none}
.hdr .icon-btn{width:39px;height:39px;border-radius:11px}
.acct-wrap{position:relative}
.acct{display:flex;align-items:center;gap:9px;min-height:38px;padding:4px 7px 4px 5px;border:0;border-radius:9px;background:none;color:var(--ink-2)}
.acct:hover,.acct[aria-expanded=true]{background:var(--subtle)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--navy-2);color:#fff;font-size:var(--fs-12);font-weight:700;display:grid;place-items:center;flex:none}
:root[data-theme=dark] .avatar{background:var(--primary)}
.acct-name{max-width:143px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-12);font-weight:700;color:var(--ink)}
.burger{display:none}
.menu{position:absolute;top:calc(100% + 10px);left:0;min-width:240px;background:var(--card);border:1px solid var(--border);border-radius:13px;box-shadow:0 19px 50px rgba(13,29,51,.16);padding:6px;z-index:60}
.menu-r{left:auto;right:0}
.menu a,.menu>button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 12px;border-radius:8px;font-size:var(--fs-14);color:var(--ink);text-decoration:none;background:none;border:0;text-align:left}
.menu a .ic,.menu>button .ic{color:var(--ink-2)}
.menu a:hover,.menu>button:hover{background:var(--subtle)}
.menu a[aria-current=page]{font-weight:600;box-shadow:inset 3px 0 0 var(--ink)}
.menu-who{padding:8px 12px 10px;border-bottom:1px solid var(--border);margin-bottom:6px}
.menu-who strong{display:block}
.menu-who span{font-size:var(--fs-13);color:var(--muted)}
.theme-set{border:0;margin:6px 0;padding:8px 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.theme-set legend{font-size:var(--fs-13);font-weight:600;padding:0;margin-bottom:4px}
.theme-set label{display:flex;align-items:center;gap:8px;min-height:32px;font-size:var(--fs-14)}
.theme-set input{width:18px;height:18px;margin:0;accent-color:var(--primary)}
@media (max-width:1199px){.acct-name{display:none}.acct{padding:4px 6px}}
/* 901–1100px: teks merek disembunyikan secara visual (seperti produksi ≤1050px) agar label nav
   tetap utuh. Disembunyikan dengan pola sr-only supaya tautan logo tetap punya nama aksesibel. */
@media (min-width:901px) and (max-width:1100px){
  .brand-words{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .hnav a,.hnav .nav-btn{padding:0 10px}
  }
@media (max-width:900px){.hnav,.hsep{display:none}.burger{display:grid}.hactions{margin-left:auto}.hdr{gap:12px;padding:0 16px}}
@media (max-width:480px){.hactions{display:none}.hdr .burger{width:44px;height:44px}.hdr{padding:0 12px}.brand img{height:40px;width:40px}}

/* 6. DRAWER (≤900px) */
.scrim{position:fixed;inset:0;background:rgba(6,22,41,.6);z-index:99}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,88vw);background:var(--navy);color:var(--side-ink);z-index:100;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .2s ease}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.drawer-brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:var(--fs-14)}
.drawer-brand img{width:32px;height:32px}
.icon-btn.inv{background:transparent;border-color:rgba(255,255,255,.25);color:#fff;width:44px;height:44px}
.drawer-scroll{overflow-y:auto;flex:1;padding:8px 12px 16px}
.drawer .theme-set{border-color:rgba(255,255,255,.12);color:#fff;padding:8px 12px}
.drawer .theme-set input{accent-color:#c7d4e6}
.drawer-who{padding:12px;color:#fff;border-top:1px solid rgba(255,255,255,.12);margin-top:12px}
.drawer-who span{display:block;font-size:var(--fs-13);color:var(--side-group)}
.drawer .side-link .nav-count{margin-left:auto}

/* 7. WORKSPACE */
.work{display:flex;align-items:flex-start}
.side{position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h) - var(--proto-h));height:calc(100dvh - var(--header-h) - var(--proto-h));width:256px;flex:none;background:var(--navy);color:var(--side-ink);display:flex;flex-direction:column}
.side-unit{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.unit-chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-12);font-weight:700;color:var(--uc);border:1px solid currentColor;border-radius:4px;padding:1px 8px}
.side-unit strong{display:block;color:#fff;font-size:var(--fs-16);margin-top:8px;line-height:1.3}
.side-unit p{font-size:var(--fs-13);color:var(--side-group);margin-top:4px}
.side-scroll{flex:1;overflow-y:auto;padding:8px 12px 16px}
.side-group{font-size:var(--fs-12);letter-spacing:.04em;font-weight:600;color:var(--side-group);margin:16px 12px 6px;text-transform:uppercase}
.side-list{list-style:none;margin:0;padding:0}
.side-link{position:relative;display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:var(--fs-14);font-weight:600;margin-bottom:2px}
.side-link:hover{background:rgba(255,255,255,.07);color:#fff}
.side-link[aria-current=page]{background:rgba(255,255,255,.1);color:#fff}
.side-link[aria-current=page]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:#fff}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.1)}
.back{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid rgba(255,255,255,.22);border-radius:8px;color:#e1ecf4;text-decoration:none;font-size:var(--fs-13);font-weight:600}
.back:hover{background:rgba(255,255,255,.07)}
.work-main{flex:1;min-width:0}
@media (max-width:1200px){.side{width:232px}}
@media (max-width:900px){.side{display:none}}

/* 8. HALAMAN */
.page,.content{max-width:1280px;margin:0 auto;padding:20px 32px 48px}
.content{max-width:1360px}
@media (max-width:640px){.page,.content{padding:16px 16px 40px}}
.crumbs ol{display:flex;flex-wrap:wrap;align-items:center;gap:4px;list-style:none;margin:0 0 12px;padding:0;font-size:var(--fs-13);color:var(--muted)}
.crumbs li{display:flex;align-items:center;gap:4px}
.crumbs a{color:var(--ink-2);text-decoration:none;min-height:24px;display:inline-flex;align-items:center}
.crumbs a:hover{text-decoration:underline}
.crumbs [aria-current=page]{color:var(--ink);font-weight:600}
.phead{display:flex;justify-content:space-between;gap:12px 16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}
.phead h1{font-size:var(--fs-24)}
.phead .desc{margin-top:4px;color:var(--muted);max-width:72ch}
.pactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back-link{display:inline-flex;align-items:center;gap:4px;min-height:32px;color:var(--ink-2);font-weight:600;font-size:var(--fs-13);text-decoration:none;margin-bottom:8px}
.back-link:hover{text-decoration:underline}

.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-h .ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-h h2{font-size:var(--fs-16)}
.panel-h .sub{font-size:var(--fs-13);color:var(--muted);width:100%}
.panel-b{padding:16px}
.rows{list-style:none;margin:0;padding:0}
.rows>li+li{border-top:1px solid var(--border)}
.stack{display:grid;gap:16px}

/* Tabel operasional */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:12px 16px;border-bottom:1px solid var(--border)}
.search{position:relative;flex:1 1 240px;max-width:420px;min-width:0}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:36px}
.fgroup{display:flex;flex-direction:column;min-width:0;flex:0 1 200px}
.fgroup .flabel{margin-bottom:4px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:12px 16px;border-bottom:1px solid var(--border);font-size:var(--fs-14)}
.tbl thead th{font-size:var(--fs-12);font-weight:600;color:var(--muted);background:var(--subtle);padding:10px 16px;white-space:nowrap}
.tbl tbody th{font-weight:400}
.tbl tbody tr:last-child>*{border-bottom:0}
.tbl tbody tr:hover{background:var(--subtle)}
.tbl .sub{display:block;font-size:var(--fs-13);color:var(--muted);margin-top:2px}
.tbl .mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.row-link{font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:24px}
.row-link:hover{text-decoration:underline;text-underline-offset:3px}
.nomatch td{text-align:center;color:var(--muted);padding:24px 16px}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 16px;border-top:1px solid var(--border)}
.pager-info{font-size:var(--fs-13);color:var(--muted)}
.pager-ctl{display:flex;align-items:center;gap:8px;font-size:var(--fs-13)}
.pager-note{width:100%;font-size:var(--fs-13);color:var(--muted)}

/* Keadaan data */
.state{padding:32px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.state h3{font-size:var(--fs-16)}
.state p{color:var(--muted);max-width:56ch}
.state .ic-wrap{width:44px;height:44px;border-radius:10px;background:var(--subtle);display:grid;place-items:center;color:var(--ink-2)}
.state .btn{margin-top:8px}
.state.error{flex-direction:row;align-items:flex-start;text-align:left;gap:12px;margin:16px;padding:16px;border:1px solid var(--st-danger);border-left-width:4px;border-radius:8px;background:var(--danger-bg)}
.state.error .ic{color:var(--st-danger);margin-top:2px}
.state.error p{color:var(--ink)}
.state.loading{align-items:stretch;text-align:left}
.sk-row{display:grid;grid-template-columns:1fr 2fr 1fr;gap:16px;padding:8px 0}
.sk{height:14px;border-radius:4px;background:var(--subtle);border:1px solid var(--border)}
.compact .state{padding:20px 16px}
.compact .state.error{margin:12px}

/* Tab segmented (ARIA tabs) */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--card);border:1px solid var(--border);border-radius:10px;max-width:100%;overflow-x:auto;margin-bottom:16px}
.seg [role=tab]{min-height:36px;padding:6px 14px;border:0;border-radius:7px;background:none;font-size:var(--fs-14);font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg [role=tab][aria-selected=true]{background:var(--primary);color:#fff}
.seg [role=tab]:focus-visible{outline-offset:-2px}

/* Statistik ringkas: satu panel terbagi, bukan kartu identik */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 16px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.stats>div{padding:14px 16px;border-left:1px solid var(--border);min-width:0}
.stats>div:first-child{border-left:0}
.stats dt{font-size:var(--fs-13);color:var(--muted);font-weight:600}
.stats dt a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.stats dd{margin:2px 0 0;font-size:var(--fs-24);font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.stats .hint{display:block;font-size:var(--fs-12);color:var(--muted);font-weight:400;line-height:1.5}
.stats dd.late{color:var(--st-danger)}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}.stats>div:nth-child(3){border-left:0}.stats>div:nth-child(n+3){border-top:1px solid var(--border)}}

/* 9. LOGIN — kartu di tengah; latar navy, atau foto monokrom + blur + lapisan navy bila foto tersedia */
.auth{position:relative;isolation:isolate;overflow:hidden}
.auth>*:not(.auth-bg){position:relative;z-index:1}
.auth-bg{position:absolute;inset:0;z-index:0;background:var(--navy)}
.auth-ph{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:grayscale(1) blur(5px) contrast(1.05);transform:scale(1.04);opacity:0;transition:opacity 1.6s ease}
.auth-ph.on{opacity:1}
/* Lapisan navy menjaga kontras teks putih di atas foto (efektif ≥ navy 82%) dan identitas warna */
.has-photo .auth-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(9,19,33,.78),rgba(9,19,33,.86))}
@media (prefers-reduced-motion:reduce){.auth-ph{transition:none}}
.auth{min-height:calc(100vh - var(--proto-h));min-height:calc(100dvh - var(--proto-h));background:var(--navy);display:grid;grid-template-rows:auto 1fr auto}
.auth-top{display:flex;justify-content:flex-end;padding:16px clamp(16px,4vw,32px)}
.auth-top .icon-btn{color:#d6dfea;border-color:rgba(255,255,255,.22);background:transparent}
.auth-top .icon-btn:hover{background:rgba(255,255,255,.08)}
.auth-top :focus-visible,.auth-foot :focus-visible{outline-color:var(--focus-inverse)}
.auth-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:8px 16px 24px}
.auth-mark{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:#fff}
.auth-mark img{width:72px;height:72px;margin-bottom:6px}
.auth-name{font-size:var(--fs-16);font-weight:700;letter-spacing:.04em}
.auth-org{font-size:var(--fs-14);color:#c3cfdc}
.auth-card{width:100%;max-width:420px;background:var(--card);color:var(--ink);border-radius:12px;padding:32px;box-shadow:0 16px 40px rgba(0,0,0,.28)}
.auth-card h1{font-size:var(--fs-20)}
.auth-card .lead{color:var(--muted);margin-top:4px}
.auth-card form{margin-top:20px}
.auth-foot{display:flex;justify-content:flex-end;padding:12px clamp(16px,4vw,32px) 16px;font-size:var(--fs-12);color:#b9c8d8}
.pw{position:relative}
.pw .input{padding-right:48px}
.pw-btn{position:absolute;right:2px;top:2px;width:40px;height:36px;display:grid;place-items:center;border:0;background:none;color:var(--ink-2);border-radius:6px}
.device{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-13);margin:16px 0;color:var(--ink-2)}
.device.is-ok .ic{color:var(--st-ok)}
.otp{font-size:24px!important;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
.link-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;margin-top:12px;border:0;background:none;color:var(--ink-2);font-weight:600;padding:0}
.link-btn:hover{text-decoration:underline}
.auth-help{margin-top:20px;font-size:var(--fs-13);color:var(--muted)}
@media (max-width:640px){
  .auth-center{justify-content:flex-start;padding-top:0}
  .auth-mark img{width:56px;height:56px}
  .auth-card{padding:24px 20px;border-radius:10px}
  .auth-foot{justify-content:center}
}

/* 10. PORTAL */
.portal-head p{color:var(--muted);margin-top:4px}
/* Kepala Portal varian B: pita navy datar (versi ringkas hero produksi), tanpa gradasi/emas.
   Cadangan opsi 2 (polos + garis) ada di scratchpad: fondasi.opsi2.html */
.portal-head{background:var(--navy-2);color:#fff;border-radius:12px;padding:22px 26px}
.portal-head h1{font-size:28px;color:#fff}
.portal-head p{color:#c3cfdc!important}
.portal-head :focus-visible{outline-color:var(--focus-inverse)}
.portal-head .ph-row{align-items:center;flex-wrap:nowrap}
.ph-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 24px;flex-wrap:wrap}
@media (max-width:640px){.portal-head h1{font-size:var(--fs-24)}.portal-head{padding:16px 18px;border-radius:10px}}
@media (max-width:400px){.portal-head .ph-row>div>p{display:none}}
/* Tab Portal: blok segmented seperti index.html; item aktif berisi --primary (teks putih 10.1:1; gelap 6.48:1) */
.ptabs{display:inline-flex;max-width:100%;margin:16px 0 20px;padding:3px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow-x:auto}
.ptabs ul{display:flex;gap:2px;list-style:none;margin:0;padding:0}
.ptabs a{display:flex;align-items:center;height:36px;padding:0 14px;border-radius:7px;font-size:var(--fs-14);font-weight:600;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.ptabs a:hover{color:var(--ink);background:var(--subtle)}
.ptabs a[aria-current=page]{color:#fff;background:var(--primary)}
.ptabs a:focus-visible{outline-offset:-2px}
.sec-title{font-size:var(--fs-16);margin-bottom:10px}
.launch{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:104px;padding:10px 6px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--ink);text-decoration:none;text-align:center}
/* Monokrom seperti index.html: unit dibedakan nama + ikon, bukan warna */
a.tile:hover{border-color:var(--ink-2)}
.tile-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--subtle);color:var(--ink);margin-bottom:4px}
.tile-name{font-size:var(--fs-14);font-weight:600;line-height:1.3}
.tile-desc{font-size:var(--fs-12);color:var(--muted);line-height:1.3}
.tile.is-off{opacity:.6;cursor:not-allowed}
.note{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:var(--fs-13);color:var(--ink-2)}
.home-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-top:24px}
.news-row{display:flex;gap:14px;padding:12px 16px;width:100%;text-align:left;background:none;border:0;color:inherit;border-radius:0}
.news-row:hover .news-title{text-decoration:underline;text-underline-offset:3px}
.ph{width:88px;height:64px;flex:none;border-radius:6px;background:var(--subtle);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}
.news-txt{min-width:0;flex:1}
.kat{display:block;font-size:var(--fs-12);font-weight:600;color:var(--muted)}
.news-title{display:block;font-size:var(--fs-14);font-weight:600;color:var(--ink);margin-top:2px}
.news-sum{display:block;font-size:var(--fs-13);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-row{display:flex;gap:12px;padding:12px 16px;align-items:flex-start}
.ag-date{width:44px;flex:none;text-align:center;border:1px solid var(--border);border-radius:6px;padding:4px 0;line-height:1.2}
.ag-date strong{display:block;font-size:var(--fs-16)}
.ag-date span{font-size:var(--fs-12);color:var(--muted)}
.ag-t{font-weight:600}
.ag-m{font-size:var(--fs-13);color:var(--muted)}
.simple-row{display:flex;gap:10px;padding:12px 16px;align-items:flex-start}
.simple-row .ic{color:var(--ink-2);margin-top:2px}
@media (max-width:1000px){.launch{grid-template-columns:repeat(3,minmax(0,1fr))}.home-grid{grid-template-columns:1fr}}
@media (max-width:480px){
  .launch{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile{height:84px;padding:6px 4px}
  .tile-ic{width:30px;height:30px;margin-bottom:2px}
  .tile-ic .ic{width:18px;height:18px}
  .tile-name{font-size:var(--fs-12)}
  .ph{width:64px;height:48px}
}

/* 11. DASHBOARD URMIN */
.dash-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 16px;align-items:start}
.job .meta{grid-column:1/-1;font-size:var(--fs-13);color:var(--muted)}
.count-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;min-height:44px;text-decoration:none;color:inherit}
.count-row:hover{background:var(--subtle)}
.count-row strong{font-variant-numeric:tabular-nums;font-size:var(--fs-16)}
.toolrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin-bottom:16px}
@media (max-width:1000px){.dash-grid{grid-template-columns:1fr}}

/* 12. DETAIL */
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:var(--fs-13);color:var(--muted);font-weight:600}
.dl dd{margin:2px 0 0}
.dl .span{grid-column:1/-1}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 20px}
.timeline li::before{content:"";position:absolute;left:4px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.timeline li::after{content:"";position:absolute;left:7px;top:17px;bottom:0;width:2px;background:var(--border)}
.timeline li:last-child::after{display:none}
.timeline small{display:block;font-size:var(--fs-13);color:var(--muted)}
.detail-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.file-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap}
@media (max-width:1000px){.detail-grid{grid-template-columns:1fr}}
@media (max-width:640px){.dl{grid-template-columns:1fr}}

/* Rentang tanggal */
.range{border:0;margin:0;padding:0;min-width:0;flex:1 1 320px}
.range legend{font-size:var(--fs-13);font-weight:600;padding:0;margin-bottom:4px}
.range-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.range-row .fgroup{flex:1 1 140px}
.range-row .flabel{font-weight:400;color:var(--ink-2)}
.range-msg{width:100%;font-size:var(--fs-13);color:var(--muted);margin-top:4px}

/* 13. DIALOG & TOAST */
.dlg-backdrop{position:fixed;inset:0;background:rgba(6,22,41,.55);display:grid;place-items:center;padding:16px;z-index:120}
.dlg{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.dlg-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--border)}
.dlg-h h2{font-size:var(--fs-20)}
.dlg-h .kat{margin-bottom:4px}
.dlg-b{padding:16px 20px;max-width:72ch}
.dlg-b p+p{margin-top:12px}
.dlg-f{display:flex;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.toasts{position:fixed;right:16px;bottom:calc(var(--proto-h) + 16px);z-index:150;display:flex;flex-direction:column;gap:8px;max-width:min(400px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--card);border:1px solid var(--border-input);border-left:4px solid var(--st-ok);border-radius:8px;box-shadow:0 8px 24px rgba(17,31,53,.18)}
.toast .ic{color:var(--st-ok);margin-top:2px}
.toast.toast-err{border-left-color:var(--st-danger)}
.toast.toast-err .ic{color:var(--st-danger)}

/* 14. BILAH PROTOTIPE (bukan bagian desain produksi) */
.proto{position:fixed;left:0;right:0;bottom:0;height:var(--proto-h);z-index:140;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--card);border-top:2px dashed var(--border-input);font-size:var(--fs-13);overflow-x:auto;white-space:nowrap}
.proto label{display:flex;align-items:center;gap:6px;font-weight:600}
.proto select{min-height:32px;padding:2px 6px;border:1px solid var(--border-input);border-radius:6px;background:var(--card);color:var(--ink);font-size:var(--fs-13)}
.proto-tag{font-weight:700;color:var(--ink)}
.proto-btn{min-height:32px;padding:2px 10px;border:1px solid var(--border-input);border-radius:6px;background:var(--card);font-size:var(--fs-13)}
body.proto-off .proto{display:none}

/* 15. DASHBOARD UNIT (halaman 7) — daftar modul, bukan kartu */
.mod-group+.mod-group{border-top:1px solid var(--border)}
.mod-group h3{font-size:var(--fs-14);font-weight:600;color:var(--ink-2);padding:12px 16px 0}
.mod-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 16px}
.mod-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--subtle);color:var(--ink)}
.mod-txt p{font-size:var(--fs-13);color:var(--muted)}
.mod-name{display:inline-flex;align-items:center;min-height:24px;font-weight:600;color:var(--ink-2)}
.mod-soon{display:inline-flex;align-items:center;gap:4px;margin-top:2px;font-size:var(--fs-13);font-weight:600;color:var(--ink-2);white-space:nowrap}
@media (max-width:480px){.mod-soon{grid-column:2}}

/* 16. KELOLA (halaman 8) */
.phead+.ptabs{margin-top:-4px}
.callout{display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;padding:12px 14px;max-width:96ch;border:1px solid var(--border);border-left:4px solid var(--st-info);border-radius:8px;background:var(--card);font-size:var(--fs-13);color:var(--ink)}
.callout .ic{color:var(--st-info);margin-top:2px}
.dlg .callout{margin:12px 0 0;background:var(--subtle)}
.u-name{font-weight:600}
.row-acts{display:flex;gap:8px;flex-wrap:wrap}
textarea.input{min-height:80px;resize:vertical;line-height:var(--lh-body)}
.secret{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-top:12px}
.secret code{flex:1 1 220px;display:flex;align-items:center;padding:8px 12px;border:1px dashed var(--border-input);border-radius:8px;background:var(--subtle);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:var(--fs-16);letter-spacing:.04em;word-break:break-all}

/* 17. DASHBOARD PIMPINAN (halaman 9) — monokrom + navy; warna hanya pada mark grafik */
.exec .stats dd{font-variant-numeric:normal}
.exec .stats dd .ic{display:inline-block;vertical-align:-3px;margin-right:4px}
.exec .stats dd .hint{margin-top:2px}
.dash-meta{display:flex;align-items:center;min-height:40px;font-size:var(--fs-13);color:var(--muted)}
.exec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px;align-items:start}
@media (max-width:1000px){.exec-grid{grid-template-columns:1fr}}
.job-t{font-weight:600}
.dec-group+.dec-group{border-top:1px solid var(--border)}
.dec-group h3{font-size:var(--fs-14);font-weight:600;color:var(--ink-2);padding:12px 16px 0}
.due-late{display:inline-flex;align-items:center;gap:4px;color:var(--st-danger);font-weight:600;white-space:nowrap}
.due-late .ic{display:inline-block}
/* Legenda: kunci warna di samping teks; teks memakai token teks, bukan warna seri */
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;list-style:none;margin:0;padding:12px 16px 0;font-size:var(--fs-13);color:var(--ink-2)}
.legend li{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.sw-line{width:2px;height:16px;border-radius:1px;background:var(--ink);flex:none}
/* Tooltip grafik: muncul saat mark di-hover atau difokus. Diposisikan relatif ke area grafik
   dengan left:p% + translateX(-p%) sehingga tidak pernah keluar dari area (aman di 320px). */
.ch-tip{display:none;position:absolute;z-index:5;pointer-events:none;padding:6px 10px;background:var(--card);color:var(--ink-2);border:1px solid var(--border-input);border-radius:6px;box-shadow:0 4px 12px rgba(17,31,53,.16);font-size:var(--fs-12);line-height:1.4;white-space:nowrap}
.ch-tip strong{display:block;color:var(--ink);font-size:var(--fs-14)}
.ch-tip .k{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
[data-mark]:hover+.ch-tip,[data-mark]:focus+.ch-tip{display:block}
/* Kolom (tren 6 bulan, small multiples berskala sama) */
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;padding:16px}
.mini{margin:0;min-width:0}
.mini figcaption{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.mini-t{font-weight:600}
.mini-s{font-size:var(--fs-13);color:var(--muted)}
.cc{position:relative;height:156px;margin-left:28px}
.cc-area{position:absolute;left:0;right:0;top:16px;bottom:0;display:flex}
.cc-grid{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--border)}
.cc-grid span{position:absolute;right:100%;top:0;transform:translateY(-50%);padding-right:6px;font-size:var(--fs-12);line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.cc-col{position:relative;flex:1 1 0;min-width:0;display:flex;justify-content:center;align-items:flex-end}
.cc-col:focus-visible{outline-offset:0}
.cc-bar{width:min(24px,60%);height:var(--h);background:var(--ch-seq);border-radius:4px 4px 0 0}
.cc-col:hover .cc-bar,.cc-col:focus .cc-bar{filter:brightness(1.18)}
.cc-val{position:absolute;left:0;right:0;bottom:calc(var(--h) + 2px);text-align:center;font-size:var(--fs-12);font-weight:600;line-height:1.3;color:var(--ink)}
.cc-x{display:flex;margin:4px 0 0 28px}
.cc-x span{flex:1 1 0;min-width:0;text-align:center;font-size:var(--fs-12);color:var(--muted)}
/* Bar 100% bertumpuk per unit: celah 2px warna permukaan, area sentuh 24px, batang 12px */
.sb-list{list-style:none;margin:0;padding:4px 16px 8px}
.sb-row{padding:12px 0}
.sb-row+.sb-row{border-top:1px solid var(--border)}
.sb-head{display:flex;justify-content:space-between;gap:8px}
.sb-head strong{font-weight:600}
.sb-head span{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-track{position:relative;display:flex;gap:2px;margin:2px 0}
.sb-seg{position:relative;flex:0 1 0;min-width:6px;height:24px}
.sb-seg::before{content:"";position:absolute;left:0;right:0;top:6px;height:12px;border-radius:4px;background:var(--c)}
.sb-seg:hover::before,.sb-seg:focus::before{filter:brightness(1.15)}
.sb-seg:focus-visible{outline-offset:1px}
.sb-track .ch-tip{bottom:calc(100% + 2px)}
.sb-fig{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:var(--fs-13);color:var(--ink-2);font-variant-numeric:tabular-nums}
.sb-fig>span{display:inline-flex;align-items:center;gap:6px}
.sb-fig .sw{width:8px;height:8px;border-radius:2px}
/* Meter realisasi anggaran: satu hue, track --subtle, penanda target bercincin warna permukaan */
.mt-list{list-style:none;margin:0;padding:4px 16px 8px}
.mt-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 17em;gap:4px 16px;align-items:center;padding:12px 0}
.mt-row+.mt-row{border-top:1px solid var(--border)}
.mt-name{font-weight:600;min-width:0}
.mt-track{position:relative;display:block;height:12px;background:var(--subtle);box-shadow:inset 0 0 0 1px var(--border);border-radius:0 4px 4px 0}
.mt-fill{position:absolute;left:0;top:0;bottom:0;background:var(--ch-seq);border-radius:0 4px 4px 0}
.mt-target{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink);box-shadow:0 0 0 2px var(--card)}
.mt-fig{text-align:right;font-size:var(--fs-13);color:var(--ink-2);font-variant-numeric:tabular-nums}
.mt-fig strong{color:var(--ink);font-size:var(--fs-14)}
.mt-d{display:block}
.mt-total{border-top:2px solid var(--border-input)!important}
@media (max-width:760px){.mt-row{grid-template-columns:minmax(0,1fr) auto}.mt-bar{grid-column:1/-1;grid-row:2}}
@media (max-width:420px){.mt-row{grid-template-columns:1fr}.mt-bar{grid-row:auto}.mt-fig{text-align:left}}
/* Tampilan tabel untuk setiap grafik */
.tview{border-top:1px solid var(--border);padding:8px 16px 12px}
.tview summary{display:inline-flex;align-items:center;gap:6px;min-height:32px;font-size:var(--fs-13);font-weight:600;color:var(--ink-2);cursor:pointer}
.tview summary:hover{text-decoration:underline;text-underline-offset:3px}
.tview .tv-hide,.tview[open] .tv-show{display:none}
.tview[open] .tv-hide{display:inline}
.tview .tbl-wrap{margin-top:8px;border:1px solid var(--border);border-radius:8px}
.tview table.tbl{min-width:420px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.hnav .ic{width:17px;height:17px;stroke-width:1.7}
.hdr .icon-btn .ic{stroke-width:1.7}

/* Foto latar login: letakkan foto resmi (tanpa wajah terlihat) di foto-login/1.jpg, 2.jpg, 3.jpg.
   Foto yang tidak ada dilewati; bila tidak ada satu pun, latar kembali ke navy polos. */
const LOGIN_PHOTOS=['foto-login/1.jpg','foto-login/2.jpg','foto-login/3.jpg'];
let loginPhotosOk=null, loginSlideTimer=null, loginSlideIdx=0;
function probeLoginPhotos(){
 if(loginPhotosOk)return;loginPhotosOk=[];
 LOGIN_PHOTOS.forEach(src=>{const im=new Image();im.onload=()=>{loginPhotosOk.push(src);if((location.hash||'#/login').indexOf('#/login')===0)paintLoginBg();};im.src=src;});
}
function paintLoginBg(){
 const bg=$('#auth-bg');if(!bg||!loginPhotosOk||!loginPhotosOk.length)return;
 loginPhotosOk.sort((x,y)=>LOGIN_PHOTOS.indexOf(x)-LOGIN_PHOTOS.indexOf(y));
 // Halaman dirender ulang saat mengetik: lanjutkan dari foto yang sedang tampil, tanpa animasi ulang.
 if(loginSlideIdx>=loginPhotosOk.length)loginSlideIdx=0;
 bg.innerHTML=loginPhotosOk.map((s,i)=>'<div class="auth-ph'+(i===loginSlideIdx?' on':'')+'" style="background-image:url('+JSON.stringify(s).replace(/"/g,'&quot;')+')"></div>').join('');
 bg.parentElement.classList.add('has-photo');
 if(loginSlideTimer||loginPhotosOk.length<2||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 loginSlideTimer=setInterval(()=>{
  const L=$$('.auth-ph');if(!L.length){clearInterval(loginSlideTimer);loginSlideTimer=null;return;}
  if(L[loginSlideIdx])L[loginSlideIdx].classList.remove('on');
  loginSlideIdx=(loginSlideIdx+1)%L.length;L[loginSlideIdx].classList.add('on');
 },6000);
}
function viewLogin(){
 const st=S.state, otp=st==='empty'||S.loginStep==='otp';
 setTimeout(()=>{probeLoginPhotos();paintLoginBg();},0);
 return '<div class="auth"><div class="auth-bg" id="auth-bg" aria-hidden="true"></div><div class="auth-top">'+themeBtn()+'</div>'+
 '<main id="main" tabindex="-1" class="auth-center">'+
 '<div class="auth-mark"><img src="logo-densus88.png" alt="Lambang Densus 88 AT Polri" width="72" height="72"><p class="auth-name">SIERA DELTA LIMA</p><p class="auth-org">BagRenmin Densus 88 AT Polri</p></div>'+
 '<section class="auth-card" aria-labelledby="page-title">'+(otp?otpForm():loginForm(st))+'</section></main>'+
 // Versi dibaca dari build saat porting (apps/frontend/package.json), bukan ditulis tangan.
 '<footer class="auth-foot"><span>SIERA DELTA LIMA v0.1.0 · '+new Date().getFullYear()+'</span></footer></div>';
}

/* Pesan galat field: pertahankan petunjuk (hint) di aria-describedby */
function fErr(input,errId,hintId,msg){
 const er=$('#'+errId);
 if(msg){input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby',(hintId?hintId+' ':'')+errId);er.hidden=false;er.innerHTML=ic('alert',16)+'<span>'+esc(msg)+'</span>';}
 else{input.removeAttribute('aria-invalid');if(hintId)input.setAttribute('aria-describedby',hintId);else input.removeAttribute('aria-describedby');er.hidden=true;}
 return !msg;
}

function openSecret(x){
 /* Password contoh tetap (fiktif). Di produksi nilainya dari respons API, tidak pernah disimpan di browser. */
 openOverlay('<div class="dlg-backdrop"><div class="dlg" id="secret-dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-d">'+
  '<div class="dlg-h"><div><span class="kat">Data contoh</span><h2 id="dlg-t">Akun dibuat: catat password sementara</h2></div></div>'+
  '<div class="dlg-b"><p id="dlg-d">Akun '+esc(x.n)+' (username <span class="mono">'+esc(x.u)+'</span>) sudah dibuat. Serahkan password ini lewat saluran yang aman. Pengguna wajib menggantinya saat pertama kali masuk.</p>'+
  '<div class="secret"><code id="pw-val">Contoh-7kQm-24Rx-Lw9p</code><button type="button" class="btn" id="copy-pw" data-action="copy-pw">'+ic('copy',16)+'Salin</button></div>'+
  '<p class="callout">'+ic('info',16)+'<span>Password hanya ditampilkan sekali dan tidak disimpan di browser. Setelah dialog ini ditutup, password tidak bisa ditampilkan lagi.</span></p></div>'+
  '<div class="dlg-f"><span></span><button type="button" class="btn" data-action="secret-close">Saya sudah mencatat, tutup</button></div></div></div>',$('[data-action=user-add]'),'#copy-pw');
 /* Escape tidak menutup dialog ini: password sekali tampil, salah tekan berarti harus reset. */
 const d=$('#secret-dlg');if(d)d.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();say('Catat password terlebih dahulu, lalu pilih Saya sudah mencatat, tutup.');}});
}
function filterUsers(){
 const box=$('#t-users');if(!box)return;
 const q=($('#q-users').value||'').trim().toLowerCase(), st=$('#f-u-st').value;
 let n=0;$$('tbody tr:not(.nomatch)',box).forEach(r=>{const ok=(!q||r.textContent.toLowerCase().includes(q))&&(st==='Semua status'||r.dataset.st===st);r.hidden=!ok;if(ok)n++;});
 let nm=$('.nomatch',box);
 if(!n){if(!nm){nm=document.createElement('tr');nm.className='nomatch';$('tbody',box).appendChild(nm);}nm.innerHTML='<td colspan="7">Tidak ada pengguna yang cocok dengan pencarian atau filter status. Periksa ejaan, atau pilih Semua status.</td>';nm.hidden=false;}
 else if(nm)nm.hidden=true;
 say(n+' pengguna ditampilkan.');
}

/* ---------- Halaman penolakan peran (tampilan saja; otorisasi tetap di server) ---------- */
/* =====================================================================
   HALAMAN 9 — DASHBOARD PIMPINAN (#/dashboard)
   Kabagrenmin: lengkap, dengan tautan ke surat yang menunggu keputusan.
   Superadmin : mode baca — tanpa tombol keputusan dan tanpa tautan ke ruang
                kerja unit (server menolak Superadmin dari endpoint operasional).
   Operator   : tidak berhak; halaman menjelaskan alasannya.
   SEMUA ANGKA DATA CONTOH dan saling konsisten: total per unit = ringkasan
   (selesai 46, berjalan 23, terlambat 5). Tanggal acuan 12 Nov 2026.
   ===================================================================== */
const EX_TODAY=Date.UTC(2026,10,12);
const EX_PERIODS=['30 hari terakhir','Triwulan ini','Tahun ini'];
const EX_MON={Mei:'Mei',Jun:'Juni',Jul:'Juli',Agu:'Agustus',Sep:'September',Okt:'Oktober'};
const EX_TREND=[['Mei',34,15],['Jun',31,14],['Jul',36,19],['Agu',28,12],['Sep',40,17],['Okt',45,21]]; /* [bulan, masuk, keluar] */
const EX_DISPO=[['urmin',18,9,2],['ren',12,6,1],['sumda',9,5,2],['binfung',7,3,0]]; /* [unit, selesai, berjalan, terlambat] */
const EX_ONTIME=38; /* dari 46 disposisi selesai, 38 sesuai tenggat */
const EX_BUDGET=[['Dukungan manajemen dan tata kelola',4850,3977],['Operasional unit',12400,9300],['Peningkatan kapasitas SDM',2100,1260],['Sarana dan prasarana',6750,3443],['Pembinaan fungsi dan pengawasan internal',1200,972]]; /* [program, pagu, realisasi] dalam juta rupiah */
const EX_TARGET=80; /* target realisasi kumulatif s.d. November, % pagu */
const EX_ARAHAN=[
 {t:'Lengkapi data dukung SPIP semester II',u:'binfung',due:'2026-11-10',st:B('danger','Terlambat')},
 {t:'Percepat realisasi belanja sarana dan prasarana',u:'ren',due:'2026-11-15',st:B('info','Dalam proses')},
 {t:'Tertibkan penomoran surat keluar sesuai PER-02',u:'urmin',due:'2026-11-20',st:B('info','Dalam proses')},
 {t:'Inventarisasi BMN rusak berat untuk usul hapus',u:'sumda',due:'2026-11-28',st:B('neutral','Belum ditanggapi')}
];
const EX_STATUS=[['Selesai','--ch-ok'],['Berjalan','--ch-run'],['Terlambat','--ch-late']];
function exParseID(s){const [d,m,y]=s.split(' ');return y+'-'+String(MONTHS.indexOf(m)+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function exRel(iso){/* sisa hari terhadap 12 Nov 2026; lewat tenggat = merah + ikon + teks */
 const [y,m,d]=iso.split('-').map(Number), n=Math.round((Date.UTC(y,m-1,d)-EX_TODAY)/864e5);
 if(n<0)return '<span class="due-late">'+ic('alert',14)+'lewat '+(-n)+' hari</span>';
 return n===0?'hari ini':n===1?'besok':n+' hari lagi';
}
const exRp=j=>'Rp'+(j/1000).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+' miliar';
const exRpFull=j=>(j*1e6).toLocaleString('id-ID');
function exTip(pos,html,bottom){return '<span class="ch-tip" aria-hidden="true" style="left:'+pos+'%;transform:translateX(-'+pos+'%)'+(bottom?';bottom:'+bottom:'')+'">'+html+'</span>';}
function exKey(c){return '<span class="k" style="--c:var('+c+')"></span>';}
function tview(table){return '<details class="tview"><summary><span class="tv-show">Tampilkan tabel</span><span class="tv-hide">Sembunyikan tabel</span></summary>'+table+'</details>';}

function exStats(per,sa){
 const L=['Surat masuk','Disposisi berjalan','Disposisi terlambat','Penyelesaian tepat waktu'];
 const H=['#/urmin/surat-masuk','#/urmin/disposisi','#/urmin/disposisi',''];
 const dt=i=>'<dt>'+(!sa&&H[i]?'<a href="'+H[i]+'">'+L[i]+'</a>':L[i])+'</dt>';
 if(S.state==='error')return '';
 if(S.state==='loading')return '<dl class="stats" aria-busy="true">'+L.map((l,i)=>'<div>'+dt(i)+'<dd><span class="sk" style="display:block;width:56px;height:24px;margin:4px 0" aria-hidden="true"></span><span class="hint">Memuat…</span></dd></div>').join('')+'</dl>';
 if(S.state==='empty')return '<dl class="stats">'+L.map((l,i)=>'<div>'+dt(i)+'<dd>'+(i===3?'–':'0')+'<span class="hint">'+(i===3?'Belum ada disposisi selesai':'Belum ada data '+per.toLowerCase())+'</span></dd></div>').join('')+'</dl>';
 const sum=k=>EX_DISPO.reduce((a,r)=>a+r[k],0), done=sum(1), run=sum(2), late=sum(3);
 const pct=Math.round(EX_ONTIME/done*100);
 return '<dl class="stats">'+
  '<div>'+dt(0)+'<dd>42<span class="hint">'+esc(per)+' · +6 dari periode sebelumnya</span></dd></div>'+
  '<div>'+dt(1)+'<dd>'+run+'<span class="hint">Masih dalam tenggat · +4 dari periode sebelumnya</span></dd></div>'+
  '<div>'+dt(2)+'<dd class="late">'+ic('alert',20)+late+'<span class="hint">Tenggat lewat · 2 lebih sedikit dari periode sebelumnya</span></dd></div>'+
  '<div>'+dt(3)+'<dd>'+pct+'%<span class="hint">'+EX_ONTIME+' dari '+done+' selesai sesuai tenggat · periode sebelumnya 79%</span></dd></div></dl>';
}

function exDecisions(sa){
 const dsp=SM.filter(s=>s.st.t==='Belum dibuka Kabagrenmin'), ttd=SK.filter(s=>s.st.t==='Menunggu persetujuan');
 const row=(href,s,meta,what)=>'<li class="job"><span class="job-t">'+esc(s.no||s.ag)+' · '+esc(s.hal)+'</span>'+
  (sa?klas(s.k):'<a class="btn btn-sm" href="'+href+'">Buka surat<span class="sr-only"> '+esc(s.no||s.ag)+' untuk '+what+'</span></a>')+'<span class="meta">'+meta+'</span></li>';
 const grp=(title,items)=>items.length?'<div class="dec-group"><h3>'+title+' ('+items.length+')</h3><ul class="rows">'+items.join('')+'</ul></div>':'';
 return grp(sa?'Menunggu disposisi Kabagrenmin':'Menunggu disposisi Anda',dsp.map(s=>row('#/urmin/surat-masuk/'+s.id,s,'Dari '+esc(s.dari)+' · diterima '+s.terima+(s.due?' · batas respons '+s.due+' ('+exRel(exParseID(s.due))+')':''),'disposisi')))+
  grp(sa?'Menunggu tanda tangan Kabagrenmin':'Menunggu tanda tangan Anda',ttd.map(s=>row('#/urmin/surat-keluar/'+s.id,s,'Untuk '+esc(s.ke)+' · diajukan '+esc(s.by)+', '+s.tgl,'tanda tangan')));
}

function exArahan(sa){
 return '<ul class="rows">'+EX_ARAHAN.slice().sort((a,b)=>a.due<b.due?-1:1).map(a=>'<li class="job">'+(sa?'<span class="job-t">'+esc(a.t)+'</span>':'<a class="row-link" href="#/arahan">'+esc(a.t)+'</a>')+badge(a.st)+'<span class="meta">'+UNITS[a.u].short+' · tenggat '+fmtISO(a.due)+' · '+exRel(a.due)+'</span></li>').join('')+'</ul>';
}

function exColumns(id,label,idx,noun,max){
 const v=EX_TREND.map(r=>r[idx]), n=v.length, tot=v.reduce((a,b)=>a+b,0);
 const hi=Math.max(...v), lo=Math.min(...v);
 const sum=label+' per bulan, Mei sampai Oktober 2026, total '+tot+'. Tertinggi '+EX_MON[EX_TREND[v.indexOf(hi)][0]]+' '+hi+', terendah '+EX_MON[EX_TREND[v.indexOf(lo)][0]]+' '+lo+'. Gunakan tombol panah untuk membaca tiap bulan.';
 return '<figure class="mini"><figcaption><span class="mini-t">'+label+'</span><span class="mini-s">Total '+tot+' surat</span></figcaption>'+
  '<div class="cc"><div class="cc-area" role="group" aria-label="'+esc(sum)+'" data-roving>'+
  [0,25,50].map(t=>'<span class="cc-grid" style="bottom:'+(t/max*100)+'%" aria-hidden="true"><span>'+t+'</span></span>').join('')+
  EX_TREND.map((r,i)=>{const h=(r[idx]/max*100).toFixed(1)+'%', pos=((i+.5)/n*100).toFixed(1);
   return '<span class="cc-col" data-mark tabindex="'+(i?-1:0)+'" role="img" aria-label="'+EX_MON[r[0]]+' 2026: '+r[idx]+' '+noun+'" style="--h:'+h+'"><span class="cc-bar"></span>'+(i===n-1?'<span class="cc-val" aria-hidden="true">'+r[idx]+'</span>':'')+'</span>'+
    exTip(pos,'<strong>'+r[idx]+' surat</strong>'+exKey('--ch-seq')+EX_MON[r[0]]+' 2026','calc('+h+' + 8px)');}).join('')+
  '</div></div><div class="cc-x" aria-hidden="true">'+EX_TREND.map(r=>'<span>'+r[0]+'</span>').join('')+'</div></figure>';
}
function exTrend(){
 return '<div class="minis">'+exColumns('tr-in','Surat masuk',1,'surat masuk',50)+exColumns('tr-out','Surat keluar',2,'surat keluar',50)+'</div>'+
  tview(tbl('t-ex-trend','Volume persuratan per bulan, Mei–Oktober 2026',[{h:'Bulan',rh:1},{h:'Surat masuk',num:1},{h:'Surat keluar',num:1}],
   EX_TREND.map(r=>[EX_MON[r[0]]+' 2026',r[1],r[2]]).concat([['<strong>Total</strong>','<strong>'+EX_TREND.reduce((a,r)=>a+r[1],0)+'</strong>','<strong>'+EX_TREND.reduce((a,r)=>a+r[2],0)+'</strong>']])));
}

function exStack(){
 let first=true;
 const rows=EX_DISPO.map(r=>{
  const u=UNITS[r[0]], v=[r[1],r[2],r[3]], tot=v[0]+v[1]+v[2], pct=v.map(x=>Math.round(x/tot*100));
  let acc=0;
  const segs=v.map((x,i)=>{if(!x)return '';const mid=((acc+x/2)/tot*100).toFixed(1);acc+=x;const ti=first?0:-1;first=false;
   return '<span class="sb-seg" data-mark tabindex="'+ti+'" role="img" aria-label="'+u.short+', '+EX_STATUS[i][0]+': '+x+' dari '+tot+' disposisi, '+pct[i]+' persen" style="--c:var('+EX_STATUS[i][1]+');flex-grow:'+x+'"></span>'+
    exTip(mid,'<strong>'+x+' disposisi · '+pct[i]+'%</strong>'+exKey(EX_STATUS[i][1])+EX_STATUS[i][0]+' · '+u.short);}).join('');
  const fig=EX_STATUS.map((s,i)=>{const t=s[0]+' '+v[i]+' ('+pct[i]+'%)';
   return i===2&&v[i]?'<span class="due-late">'+ic('alert',14)+t+'</span>':'<span><span class="sw" style="--c:var('+s[1]+')" aria-hidden="true"></span>'+t+'</span>';}).join('');
  return '<li class="sb-row"><div class="sb-head"><strong>'+u.short+'</strong><span>'+tot+' disposisi</span></div><div class="sb-track">'+segs+'</div><p class="sb-fig">'+fig+'</p></li>';
 }).join('');
 return '<ul class="legend" aria-label="Keterangan warna">'+EX_STATUS.map(s=>'<li><span class="sw" style="--c:var('+s[1]+')" aria-hidden="true"></span>'+s[0]+'</li>').join('')+'</ul>'+
  '<ul class="sb-list" data-roving aria-label="Status disposisi per unit. Gunakan tombol panah untuk membaca tiap bagian.">'+rows+'</ul>'+
  tview(tbl('t-ex-dispo','Status disposisi per unit',[{h:'Unit',rh:1},{h:'Selesai',num:1},{h:'Berjalan',num:1},{h:'Terlambat',num:1},{h:'Total',num:1}],
   EX_DISPO.map(r=>[UNITS[r[0]].short,r[1],r[2],r[3],r[1]+r[2]+r[3]])));
}

function exBudget(){
 const tp=EX_BUDGET.reduce((a,r)=>a+r[1],0), tr=EX_BUDGET.reduce((a,r)=>a+r[2],0);
 const gap=pc=>{const d=pc-EX_TARGET;return d>0?d+' poin di atas target':d<0?(-d)+' poin di bawah target':'Tepat sesuai target';};
 const row=(name,p,r,total)=>{const pc=Math.round(r/p*100);
  return '<li class="mt-row'+(total?' mt-total':'')+'"><span class="mt-name">'+esc(name)+'</span><span class="mt-bar" aria-hidden="true"><span class="mt-track"><span class="mt-fill" style="width:'+Math.min(pc,100)+'%"></span><span class="mt-target" style="left:'+EX_TARGET+'%"></span></span></span>'+
   '<span class="mt-fig"><strong>'+pc+'%</strong> · '+exRp(r)+' dari '+exRp(p)+'<span class="mt-d">'+gap(pc)+'</span></span></li>';};
 return '<ul class="legend" aria-label="Keterangan grafik"><li><span class="sw" style="--c:var(--ch-seq)" aria-hidden="true"></span>Realisasi</li><li><span class="sw-line" aria-hidden="true"></span>Target '+EX_TARGET+'% s.d. November</li></ul>'+
  '<ul class="mt-list">'+EX_BUDGET.map(b=>row(b[0],b[1],b[2])).join('')+row('Total BagRenmin',tp,tr,true)+'</ul>'+
  tview(tbl('t-ex-budget','Realisasi anggaran per program, tahun anggaran 2026',[{h:'Program',rh:1},{h:'Pagu (Rp)',num:1},{h:'Realisasi (Rp)',num:1},{h:'Realisasi',num:1},{h:'Terhadap target '+EX_TARGET+'%',num:1}],
   EX_BUDGET.concat([['Total BagRenmin',tp,tr]]).map(b=>{const pc=Math.round(b[2]/b[1]*100),d=pc-EX_TARGET;return [esc(b[0]),exRpFull(b[1]),exRpFull(b[2]),pc+'%',(d>0?'+':d<0?'−':'')+Math.abs(d)+' poin'];})));
}

function denyPage(what){return phead(what+' tidak tersedia untuk akun ini','Akun Superadmin mengelola pengguna dan akses. Server menolak permintaan ruang kerja unit dari akun ini, jadi halaman ini tidak memuat data.','<a class="btn btn-primary" href="#/kelola/pengguna">Buka Pengguna & akses</a>');}

/* =====================================================================
   ROUTER — tambahkan halaman baru di resolve()
   kembalikan {nav, title, body, ws?, menu?}; body = HTML lengkap di bawah header
   ===================================================================== */
function route(){
 const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
 return resolve(p.length?p:['login']);
}
function resolve(p){
 const a=p[0],b=p[1],c=p[2],sa=S.role==='superadmin';
 const wrap=h=>'<main id="main" tabindex="-1" class="page">'+h+'</main>';
 if(a==='login')return {login:true,title:'Masuk'};
 if(a==='portal')return {nav:'portal',title:'Portal',body:wrap(viewPortal(b||'beranda'))};
 if(a==='urmin'){
  const menu=b||'dashboard';
  if(sa)return {nav:'',title:'Urmin',body:wrap(denyPage('Ruang kerja Urmin'))};
  let inner,title;
  if(menu==='dashboard'){inner=viewUrminDash();title='Dashboard Urmin';}
  else if(menu==='surat-masuk'){inner=c?viewSuratMasukDetail(c):viewSuratMasuk();title='Surat masuk';}
  else if(menu==='surat-keluar'){inner=c?viewSuratKeluarDetail(c):viewSuratKeluar();title='Surat keluar';}
  else if(menu==='disposisi'){inner=viewDisposisi(true);title='Disposisi';}
  else {const m=URMIN_MENU.find(x=>x[0]===menu);title=m?m[1]:'Urmin';inner=crumbs([['Portal','#/portal'],['Urmin','#/urmin'],[title]])+notBuilt(title);}
  return {nav:'',title:title+' · Urmin',ws:'urmin',menu:menu,body:workspace('urmin',menu,inner)};
 }
 if(a==='unit'){ /* HALAMAN 7 */
  const uid=UNIT_MODS[b]?b:'ren', u=UNITS[uid];
  if(sa)return {nav:'',title:u.short,body:wrap(denyPage('Ruang kerja '+u.short))};
  if(c){const m=findMod(uid,c);return {nav:'',title:(m?m[1]:'Modul tidak ditemukan')+' · '+u.short,ws:uid,menu:c,body:workspace(uid,c,viewUnitModule(uid,c))};}
  return {nav:'',title:'Dashboard '+u.short,ws:uid,menu:'dashboard',body:workspace(uid,'dashboard',viewUnitDash(uid))};
 }
 if(a==='kelola'){ /* HALAMAN 8 */
  const t=b==='role'?'Role & izin':'Pengguna & akses';
  if(!sa)return {nav:'',title:t,body:wrap(crumbs([['Portal','#/portal'],[t]])+phead(t+' khusus Superadmin','Halaman ini hanya untuk administrator identitas. Server menolak permintaan dari akun lain, jadi halaman ini tidak memuat data. Di prototipe, pilih peran Superadmin di bilah bawah untuk melihatnya.','<a class="btn btn-primary" href="#/portal">Buka Portal</a>'))};
  return {nav:'kelola',title:t,body:wrap(b==='role'?viewRoles():viewUsers())};
 }
 if(a==='tugas'){if(sa)return {nav:'',title:'Tugas',body:wrap(denyPage('Tugas disposisi'))};return {nav:'tugas',title:'Tugas disposisi',body:wrap(viewDisposisi(false))};}
 if(a==='dashboard'){ /* HALAMAN 9 */
  if(S.role==='operator')return {nav:'',title:'Dashboard pimpinan',body:wrap(crumbs([['Portal','#/portal'],['Dashboard pimpinan']])+phead('Dashboard pimpinan khusus Kabagrenmin','Ringkasan ini disiapkan untuk pimpinan BagRenmin. Akun Anda tidak memiliki akses, jadi halaman ini tidak memuat data. Di prototipe, pilih peran Kabagrenmin di bilah bawah untuk melihatnya.','<a class="btn btn-primary" href="#/portal">Buka Portal</a>'))};
  return {nav:'dashboard',title:'Dashboard pimpinan',body:wrap(viewExecDash())};
 }
 const simple={arahan:'Arahan pimpinan',inbox:'Inbox distribusi',profil:'Profil saya'};
 if(simple[a]){
  if(a==='profil'){const m=me();return {nav:'',title:'Profil saya',body:wrap(crumbs([['Portal','#/portal'],['Profil saya']])+phead('Profil saya','Data akun Anda. Perubahan nama dan email dilakukan oleh administrator.')+panel({id:'h-prof',title:'Akun',body:'<div class="panel-b"><dl class="dl"><div><dt>Nama</dt><dd>'+esc(m.name)+'</dd></div><div><dt>Jabatan</dt><dd>'+esc(m.title)+'</dd></div><div><dt>Email</dt><dd>'+esc(m.email)+'</dd></div></dl>'+themeSet('tp-p')+'</div>'}))};}
  return {nav:a,title:simple[a],body:wrap(crumbs([['Portal','#/portal'],[simple[a]]])+notBuilt(simple[a]))};
 }
 return {nav:'',title:'Halaman tidak ditemukan',body:wrap(phead('Halaman tidak ditemukan','Alamat ini tidak ada di prototipe.','<a class="btn btn-primary" href="#/portal">Buka Portal</a>'))};
}

/* ---------- Render ---------- */
function render(opt){
 opt=opt||{};
 const r=route();
 closeOverlays(true);
 $('#app').innerHTML=r.login?viewLogin():header(r.nav)+r.body;
 document.title=r.title+' – SIERA DELTA LIMA (prototipe)';
 applyTheme();syncBar();
 if(!S.first&&opt.focus!==false){window.scrollTo(0,0);const h=$('#page-title');if(h)h.focus();}
 S.first=false;
}

/* ---------- Tema ---------- */
function getPref(){try{return localStorage.getItem('sdl-theme')||'system';}catch(e){return 'system';}}
function setPref(v){try{localStorage.setItem('sdl-theme',v);}catch(e){}applyTheme();}
function applyTheme(){
 const pref=getPref(), dark=pref==='dark'||(pref==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
 document.documentElement.setAttribute('data-theme',dark?'dark':'light');
 $$('[data-action=theme-toggle]').forEach(b=>{b.setAttribute('aria-pressed',String(dark));b.innerHTML=ic(dark?'sun':'moon',18);});
 $$('[data-theme-pref]').forEach(r=>{r.checked=r.value===pref;});
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

/* ---------- Bilah prototipe ---------- */
const PAGES=[['#/login','Login'],['#/portal','Portal · Beranda'],['#/portal/berita','Portal · Berita & pengumuman'],['#/portal/kalender','Portal · Kalender'],['#/portal/sop','Portal · SOP & peraturan'],['#/urmin','Urmin · Dashboard'],['#/urmin/surat-masuk','Urmin · Surat masuk'],['#/urmin/surat-masuk/sm1','Urmin · Detail surat masuk'],['#/urmin/surat-keluar','Urmin · Surat keluar'],['#/urmin/surat-keluar/sk2','Urmin · Detail surat keluar'],['#/urmin/disposisi','Urmin · Disposisi'],['#/unit/ren','Subbagren · Dashboard'],['#/unit/sumda','Subbagsumda · Dashboard'],['#/unit/binfung','Subbagbinfung · Dashboard'],['#/unit/sumda/layanan','Subbagsumda · Modul segera hadir'],['#/dashboard','Dashboard pimpinan'],['#/kelola/pengguna','Kelola · Pengguna & akses'],['#/kelola/role','Kelola · Role & izin']];
$('#p-page').innerHTML='<option value="">Halaman lain</option>'+PAGES.map(p=>'<option value="'+p[0]+'">'+p[1]+'</option>').join('');
function syncBar(){
 const h=location.hash||'#/login';
 $('#p-page').value=PAGES.some(p=>p[0]===h)?h:'';
 $('#p-role').value=S.role;$('#p-state').value=S.state;
 const login=h.indexOf('#/login')===0||h==='';
 const L=login?{normal:'Formulir',loading:'Menunggu verifikasi perangkat',empty:'Tahap kode verifikasi',error:'Gagal masuk'}:{normal:'Normal',loading:'Memuat',empty:'Kosong',error:'Error'};
 $$('#p-state option').forEach(o=>{o.textContent=L[o.value];});
 document.body.classList.toggle('proto-off',!S.bar);
}
$('#p-page').addEventListener('change',e=>{
 const v=e.target.value;if(!v)return;
 if(v.indexOf('#/kelola')===0&&S.role!=='superadmin'){S.role='superadmin';toast('Peran diganti ke Superadmin untuk halaman ini.');}
 else if(/^#\/(urmin|unit|tugas|inbox|arahan)/.test(v)&&S.role==='superadmin'){S.role='operator';toast('Peran diganti ke Operator Urmin untuk halaman ini.');}
 else if(v==='#/dashboard'&&S.role==='operator'){S.role='kabag';toast('Peran diganti ke Kabagrenmin untuk halaman ini.');}
 location.hash=v;
});
$('#p-role').addEventListener('change',e=>{S.role=e.target.value;render({focus:false});toast('Peran: '+me().title+'.');});
$('#p-state').addEventListener('change',e=>{S.state=e.target.value;render({focus:false});say('Keadaan data: '+e.target.selectedOptions[0].textContent);});
$('#p-hide').addEventListener('click',()=>{S.bar=false;syncBar();const h=$('#page-title');if(h)h.focus();say('Bilah prototipe disembunyikan. Tekan Alt+Shift+P untuk menampilkan lagi.');});

/* ---------- Umpan balik ---------- */
function say(msg){const el=$('#sr-live');el.textContent='';setTimeout(()=>{el.textContent=msg;},50);}
function toast(msg,err){const el=document.createElement('div');el.className='toast'+(err?' toast-err':'');el.innerHTML=ic(err?'alert':'check',18)+'<span>'+esc(msg)+'</span>';$('#toasts').appendChild(el);setTimeout(()=>el.remove(),6000);}

/* ---------- Overlay: dialog & drawer (focus trap, Escape, fokus kembali) ---------- */
let ret=null;
const FOC='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function setInert(on){$('#app').inert=on;$('#proto').inert=on;}
function openOverlay(html,trigger,initial){
 ret=trigger||document.activeElement;
 $('#overlay-root').innerHTML=html;setInert(true);
 const root=$('#overlay-root'), first=initial?$(initial,root):$$(FOC,root)[0];
 if(first)first.focus();
}
function closeOverlays(silent){
 const root=$('#overlay-root');if(!root.innerHTML)return;
 root.innerHTML='';setInert(false);
 if(!silent&&ret&&document.contains(ret))ret.focus();
 ret=null;
}
function openDrawer(btn){
 openOverlay(drawerHTML(),btn,'#drawer .icon-btn');
 btn.setAttribute('aria-expanded','true');
 requestAnimationFrame(()=>{const d=$('#drawer');if(d)d.classList.add('open');});
 applyTheme();
}
function openNews(i,btn){
 const n=NEWS[i];
 openOverlay('<div class="dlg-backdrop" data-action="dlg-backdrop"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="dlg-h"><div><span class="kat">'+n.k+' · '+n.d+' · Data contoh</span><h2 id="dlg-t">'+esc(n.t)+'</h2></div><button type="button" class="icon-btn" data-action="dlg-close" aria-label="Tutup">'+ic('x',18)+'</button></div><div class="dlg-b"><p>'+esc(n.s)+'</p><p>Isi lengkap berita tampil di sini. Teks ini adalah contoh untuk menguji panjang baris dan keterbacaan, dibatasi sekitar 72 karakter per baris.</p></div><div class="dlg-f"><span></span><button type="button" class="btn" data-action="dlg-close">Tutup</button></div></div></div>',btn,'.dlg [data-action=dlg-close]');
}
document.addEventListener('keydown',e=>{
 if(e.altKey&&e.shiftKey&&(e.key==='P'||e.key==='p')){e.preventDefault();S.bar=!S.bar;syncBar();say(S.bar?'Bilah prototipe ditampilkan.':'Bilah prototipe disembunyikan.');return;}
 const root=$('#overlay-root');
 if(e.key==='Escape'){
  if(root.innerHTML){e.preventDefault();closeOverlays(false);const b=$('.burger');if(b)b.setAttribute('aria-expanded','false');return;}
  const open=$('[data-action=disc][aria-expanded=true]');if(open){toggleDisc(open,false);open.focus();}
  return;
 }
 if(e.key==='Tab'&&root.innerHTML){
  const f=$$(FOC,root).filter(x=>x.offsetParent!==null||x===document.activeElement);if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
 const t=e.target;
 if(t.getAttribute&&t.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
  e.preventDefault();const list=$$('[role=tab]',t.parentNode);let i=list.indexOf(t);
  i=e.key==='Home'?0:e.key==='End'?list.length-1:(i+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;
  selectTab(list[i]);
 }
});

/* ---------- Disclosure (menu Kelola, menu akun) ---------- */
function toggleDisc(btn,force){
 const el=document.getElementById(btn.getAttribute('aria-controls'));if(!el)return;
 const open=force!==undefined?force:btn.getAttribute('aria-expanded')!=='true';
 $$('[data-action=disc][aria-expanded=true]').forEach(b=>{if(b!==btn){b.setAttribute('aria-expanded','false');const m=document.getElementById(b.getAttribute('aria-controls'));if(m)m.hidden=true;}});
 btn.setAttribute('aria-expanded',String(open));el.hidden=!open;
}
function selectTab(btn){
 S.tabs[btn.dataset.group]=btn.dataset.val;render({focus:false});
 const n=$('#tab-'+btn.dataset.group+'-'+btn.dataset.val);if(n)n.focus();
}

/* ---------- Delegasi klik ---------- */
const ACTIONS={
 skip(e){e.preventDefault();const m=$('#main');if(m)m.focus();},
 'theme-toggle'(){const dark=document.documentElement.getAttribute('data-theme')==='dark';setPref(dark?'light':'dark');},
 disc(e,t){toggleDisc(t);},
 'drawer-open'(e,t){openDrawer(t);},
 'drawer-close'(){closeOverlays(false);const b=$('.burger');if(b)b.setAttribute('aria-expanded','false');},
 'dlg-close'(){closeOverlays(false);},
 'dlg-backdrop'(e,t){if(e.target===t)closeOverlays(false);},
 news(e,t){openNews(+t.dataset.i,t);},
 tab(e,t){selectTab(t);},
 retry(){
  S.state='loading';render({focus:false});syncBar();say('Memuat ulang data…');
  const h=$('#page-title');if(h)h.focus();
  setTimeout(()=>{S.state='normal';render({focus:false});const h2=$('#page-title');if(h2)h2.focus();toast('Data dimuat ulang.');},900);
 },
 page(e,t){
  const pg=t.closest('[data-pager]'),key=pg.dataset.pager,pages=+pg.dataset.pages;
  let p=(S.page[key]||1)+(+t.dataset.dir);p=Math.max(1,Math.min(pages,p));S.page[key]=p;
  $('[data-pager-label]',pg).textContent='Halaman '+p+' dari '+pages;
  const [prev,next]=$$('[data-action=page]',pg);prev.disabled=p<=1;next.disabled=p>=pages;
  if(t.disabled)(t===prev?next:prev).focus();
 },
 'pw-toggle'(e,t){const i=$('#f-pass'),show=i.type==='password';i.type=show?'text':'password';t.setAttribute('aria-pressed',String(show));t.innerHTML=ic(show?'eyeOff':'eye',18);},
 'otp-back'(){S.state='normal';S.loginStep='cred';render();const u=$('#f-user');if(u)u.focus();},
 'clear-range'(){$('#r-from').value='';$('#r-to').value='';checkRange();$('#r-from').focus();},
 logout(){S.state='normal';S.loginStep='cred';location.hash='#/login';toast('Anda sudah keluar.');},
 noop(){toast('Simulasi: aksi ini tidak dijalankan di prototipe.');}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-action]');
 if(!t){const open=$('[data-action=disc][aria-expanded=true]');if(open&&!e.target.closest('.menu'))toggleDisc(open,false);return;}
 const f=ACTIONS[t.dataset.action];if(f)f(e,t);
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-theme-pref]'))setPref(e.target.value);
 if(e.target.matches('[data-range]'))checkRange();
});

/* ---------- Pencarian lokal di tabel/daftar ---------- */
document.addEventListener('input',e=>{
 const inp=e.target;if(!inp.dataset||!inp.dataset.filter)return;
 const box=document.getElementById(inp.dataset.filter);if(!box)return;
 const q=inp.value.trim().toLowerCase();
 const items=box.tagName==='TABLE'?$$('tbody tr:not(.nomatch)',box):$$(':scope>li',box);
 let n=0;items.forEach(r=>{const ok=!q||r.textContent.toLowerCase().includes(q);r.hidden=!ok;if(ok)n++;});
 let nm=$('.nomatch',box);
 if(!n&&q){
  if(!nm){nm=document.createElement(box.tagName==='TABLE'?'tr':'li');nm.className='nomatch';(box.tagName==='TABLE'?$('tbody',box):box).appendChild(nm);}
  const span=box.tagName==='TABLE'?$$('thead th',box).length:1;
  nm.innerHTML=(box.tagName==='TABLE'?'<td colspan="'+span+'">':'<div class="state">')+'Tidak ada hasil untuk “'+esc(inp.value)+'”. Periksa ejaan atau kosongkan pencarian.'+(box.tagName==='TABLE'?'</td>':'</div>');
  nm.hidden=false;
 } else if(nm) nm.hidden=true;
 say(q?n+' hasil ditemukan.':'Pencarian dikosongkan.');
});

/* ---------- Interaksi halaman 8 (Pengguna & akses) ---------- */
Object.assign(ACTIONS,{
 'user-add'(e,t){openAddUser(t);},
 'user-deact'(e,t){openDeact(t);},
 'user-react'(e,t){/* tidak destruktif: langsung, dengan umpan balik. Produksi juga meminta alasan (lihat laporan). */
  const x=USERS.find(u=>u.id===t.dataset.id);if(!x)return;
  x.st=x.prev&&x.prev!=='inactive'?x.prev:'active';updateUserRow(x);toast('Akun '+x.n+' diaktifkan kembali.');},
 'copy-pw'(e,t){
  const v=$('#pw-val').textContent;
  const done=()=>{t.innerHTML=ic('check',16)+'Tersalin';say('Password sementara disalin.');};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents($('#pw-val'));const s=getSelection();s.removeAllRanges();s.addRange(r);let ok=false;try{ok=document.execCommand('copy');}catch(_){}
   if(ok)done();else toast('Tidak dapat menyalin otomatis. Password sudah dipilih; tekan Ctrl+C untuk menyalin.',true);};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(v).then(done,fallback);else fallback();
 },
 'secret-close'(){const x=S.newUser;closeOverlays(false);if(x)toast('Akun '+x.n+' ditambahkan. Tetapkan unit dan role lewat Ubah akses.');S.newUser=null;}
});
/* ---------- Interaksi halaman 9 (Dashboard pimpinan) ---------- */
/* Grafik: satu tab stop per grafik; panah/Home/End berpindah antar-mark (roving tabindex).
   Fokus pada mark menampilkan tooltip yang sama dengan hover. */
document.addEventListener('keydown',e=>{
 const t=e.target;if(!t.hasAttribute||!t.hasAttribute('data-mark'))return;
 const g=t.closest('[data-roving]');if(!g)return;
 const k=e.key;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(k))return;
 e.preventDefault();
 const m=$$('[data-mark]',g);let i=m.indexOf(t);
 i=k==='Home'?0:k==='End'?m.length-1:(k==='ArrowRight'||k==='ArrowDown')?Math.min(m.length-1,i+1):Math.max(0,i-1);
 m.forEach(x=>{x.tabIndex=-1;});m[i].tabIndex=0;m[i].focus();
});
document.addEventListener('change',e=>{
 if(e.target.id!=='f-dash-period')return;
 S.dashPeriod=+e.target.value;render({focus:false});
 const s=$('#f-dash-period');if(s)s.focus();
 toast('Periode: '+EX_PERIODS[S.dashPeriod]+'. Di prototipe, angka contoh tidak berubah per periode.');
});
document.addEventListener('input',e=>{if(e.target.id==='q-users')filterUsers();});
document.addEventListener('change',e=>{if(e.target.id==='f-u-st')filterUsers();});
document.addEventListener('submit',e=>{
 const f=e.target;
 if(f.id==='deact-form'){
  e.preventDefault();
  const r=$('#deact-reason'),v=r.value.trim();
  if(!fErr(r,'deact-err','deact-hint',!v?'Isi alasan penonaktifan. Alasan ini dicatat di riwayat audit akun.':v.length<8?'Alasan terlalu pendek. Tulis minimal 8 karakter, misalnya “Pindah tugas ke satuan lain”.':'')){r.focus();return;}
  const x=USERS.find(u=>u.id===f.dataset.id);if(!x)return;
  x.prev=x.st;x.st='inactive';updateUserRow(x);
  closeOverlays(false);toast('Akun '+x.n+' dinonaktifkan.');
 }
 if(f.id==='add-user-form'){
  e.preventDefault();
  const n=$('#au-name'),u=$('#au-user'),m=$('#au-mail'),r=$('#au-reason');
  const un=u.value.trim().toLowerCase(), mail=m.value.trim().toLowerCase(), rs=r.value.trim();
  fErr(n,'au-name-err','',n.value.trim()?'':'Isi nama lengkap pengguna.');
  fErr(u,'au-user-err','au-user-hint',!un?'Isi username.':!/^[a-z0-9._]{3,}$/.test(un)?'Username hanya boleh huruf kecil, angka, titik, atau garis bawah, minimal 3 karakter.':USERS.some(x=>x.u===un)?'Username '+un+' sudah dipakai. Pilih username lain.':'');
  fErr(m,'au-mail-err','',!mail?'Isi email dinas.':!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)?'Format email belum benar. Contoh: nama@contoh.test':USERS.some(x=>x.e===mail)?'Email ini sudah dipakai akun lain.':'');
  fErr(r,'au-reason-err','au-reason-hint',!rs?'Isi alasan pembuatan akun.':rs.length<8?'Alasan terlalu pendek. Tulis minimal 8 karakter.':'');
  const bad=$('[aria-invalid=true]',f);if(bad){bad.focus();return;}
  const nu={id:'u'+(USERS.length+1),n:n.value.trim(),u:un,e:mail,unit:'Belum ditetapkan',role:'Belum ditetapkan',st:'must',otp:0};
  USERS.push(nu);S.newUser=nu;
  render({focus:false}); /* menutup dialog formulir & menampilkan baris baru */
  openSecret(nu);
 }
});

/* ---------- Validasi rentang tanggal disposisi ---------- */
function checkRange(){
 const f=$('#r-from'),t=$('#r-to'),err=$('#r-err'),msg=$('#range-msg');if(!f)return;
 t.removeAttribute('aria-invalid');err.hidden=true;
 if(f.value&&t.value&&t.value<f.value){t.setAttribute('aria-invalid','true');err.hidden=false;err.innerHTML=ic('alert',16)+'<span>Tanggal "Sampai" harus sama dengan atau setelah tanggal "Dari". Ubah salah satu tanggal.</span>';msg.textContent='Rentang belum diterapkan.';return;}
 msg.textContent=f.value&&t.value?'Rentang diterapkan: '+fmtISO(f.value)+' sampai '+fmtISO(t.value)+'.':(f.value||t.value)?'Isi kedua tanggal untuk menerapkan rentang.':'Tanpa rentang: menampilkan surat 15 hari ke belakang sampai 15 hari ke depan yang belum selesai.';
}

/* ---------- Formulir login & OTP ---------- */
function fieldErr(input,errEl,msg){
 if(msg){input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby',errEl.id);errEl.hidden=false;errEl.innerHTML=ic('alert',16)+'<span>'+msg+'</span>';}
 else{input.removeAttribute('aria-invalid');errEl.hidden=true;if(input.id!=='f-otp')input.removeAttribute('aria-describedby');}
}
document.addEventListener('submit',e=>{
 if(e.target.id==='login-form'){
  e.preventDefault();
  const u=$('#f-user'),p=$('#f-pass');
  fieldErr(u,$('#f-user-err'),u.value.trim()?'':'Isi username atau email Anda.');
  fieldErr(p,$('#f-pass-err'),p.value?'':'Isi password Anda.');
  const bad=$('[aria-invalid=true]',e.target);if(bad){bad.focus();return;}
  const un=u.value.trim().toLowerCase();S.role=/admin/.test(un)?'superadmin':/hendra|kabag/.test(un)?'kabag':'operator';
  S.loginStep='otp';render();const o=$('#f-otp');if(o)o.focus();say('Kode verifikasi dikirim ke email Anda.');
 }
 if(e.target.id==='otp-form'){
  e.preventDefault();const o=$('#f-otp');
  if(!/^\d{6}$/.test(o.value)){o.setAttribute('aria-invalid','true');o.setAttribute('aria-describedby','f-otp-hint f-otp-err');const er=$('#f-otp-err');er.hidden=false;er.innerHTML=ic('alert',16)+'<span>Kode harus 6 angka. Salin dari email terbaru, tanpa spasi.</span>';o.focus();return;}
  S.state='normal';S.loginStep='cred';location.hash='#/portal';
 }
});

window.addEventListener('hashchange',()=>{if(location.hash.indexOf('#/')===0||location.hash==='')render();});
render();
})();
